version: '3.8'

services:
  api:
    build: .
    container_name: helpdesk-api
    ports:
      - "8000:8000"
    volumes:
    environment:
      - DATABASE_URL=sqlite:///./src/data/helpdesk.db
      - SECRET_KEY=secret
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
